# Isolated test environment. Used by scripts/test-*.sh with a dedicated project
# name (-p taskboard-test) so it never touches the production volumes.
name: taskboard-test

services:
  test-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: taskboard_test
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: test-only-password
    tmpfs: ["/var/lib/postgresql"]
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard_test -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30

  test-redis:
    image: redis:7.4.12-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api-test:
    build:
      context: ./backend
      target: test
    environment:
      APP_ENV: test
      LOG_LEVEL: WARNING
      JWT_SECRET: test-only-jwt-secret-not-for-production
      POSTGRES_HOST: test-db
      POSTGRES_DB: taskboard_test
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: test-only-password
      REDIS_URL: redis://test-redis:6379/0
      PUBLIC_BASE_URL: http://testserver
      ALLOWED_ORIGINS: http://testserver
      ATTACHMENTS_DIR: /tmp/attachments
      ARGON2_TIME_COST: "1"
      ARGON2_MEMORY_COST_KIB: "8192"
      ARGON2_PARALLELISM: "1"
      REGISTER_RATE_PER_MINUTE: "1000"
      IP_AUTH_RATE_PER_MINUTE: "1000"
      PASSWORD_RESET_RATE_PER_MINUTE: "1000"
    depends_on:
      test-db: { condition: service_healthy }
      test-redis: { condition: service_healthy }
    tmpfs: ["/tmp"]

  frontend-test:
    build:
      context: ./frontend
      target: test
