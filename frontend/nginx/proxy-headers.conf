proxy_http_version 1.1;
# Exact Host the browser used (including the port) so the API can do same-origin checks.
proxy_set_header Host $tb_host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite (never append) so clients cannot spoof their address; $remote_addr
# already reflects a trusted upstream proxy via the realip module.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $tb_forwarded_proto;
proxy_set_header X-Request-ID $request_id;
proxy_set_header Connection "";
