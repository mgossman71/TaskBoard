[project]
name = "taskboard"
version = "1.0.0"
description = "TaskBoard project management platform - API server"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "sqlalchemy[asyncio]>=2.0.44",
  "asyncpg>=0.30",
  "alembic>=1.17",
  "pydantic>=2.12",
  "pydantic-settings>=2.11",
  "email-validator>=2.3",
  "argon2-cffi>=25.1",
  "pyjwt>=2.10",
  "redis>=7.0",
  "structlog>=25.4",
  "python-multipart>=0.0.20",
  "puremagic>=1.30",
  "aiosmtplib>=4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "httpx>=0.28",
  "hypothesis>=6.140",
  "websockets>=15.0",
  "pytest-cov>=7.0",
  "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: performance-oriented tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "S105", "S106", "E501", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"alembic/**" = ["E501"]
"alembic/versions/**" = ["E501", "W291", "I001"]  # autogenerated, hand-reviewed

[tool.uv]
# Reproducibility / supply-chain hygiene: never resolve packages published in the
# two weeks before the lock was produced.
exclude-newer = "2026-10-19T00:00:00Z"

[tool.coverage.run]
source = ["taskboard"]
concurrency = ["greenlet", "thread"]
